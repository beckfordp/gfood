# gfood's application manifest: the platform services it
# deploys its own instances of, and its own services. Read by people for now; gluon's
# deploy tooling reads it once it supports applications.
app: gfood
namespace: gfood

platform:            # from gluon's services/, never copied
  - name: user-service-rs
    use: customers; restaurant staff and couriers once roles exist (open question 1)
  - name: payment-service-rs
    use: authorise at checkout, refunds
  - name: notification-service-rs
    use: a message to the customer on every status change
  - name: order-service-rs
    use: the order and its lifecycle (open question 3)
  - name: catalog-service-rs
    use: menus, grouped by restaurant; options and extras from R1
  - name: cart-service-rs
    use: the basket, one restaurant per basket

own:                 # under services/, each its own repo
  - name: restaurant-service-rs
    status: planned
    use: restaurants, hours, zones, accept or reject, prep time, ready
  - name: dispatch-service-rs
    status: planned
    use: couriers online, offers, assignment, pick-up, delivery, tracking

not-used:
  - inventory-service-rs   # sold out is a flag, not a count (open question)
  - fulfilment-service-rs  # replaced by dispatch
